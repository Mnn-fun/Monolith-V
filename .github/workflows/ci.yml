name: Backend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build & Test Backend (.NET)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.x
          10.x

    - name: Restore dependencies
      run: dotnet restore Backend/MonolithV.Backend.sln

    - name: Build solution
      run: dotnet build Backend/MonolithV.Backend.sln --no-restore --configuration Release

    - name: Run unit & integration tests
      run: dotnet test Backend/MonolithV.Backend.sln --no-build --configuration Release --verbosity normal
